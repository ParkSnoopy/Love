name: Build macOS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rolling-macos
  cancel-in-progress: true

jobs:
  build-macos:
    name: macOS release bundle
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build macOS
        run: flutter build macos --release

      - name: Package macOS artifact
        run: |
          ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/Love.app love-macos.zip
          shasum -a 256 love-macos.zip > love-macos.zip.sha256

      - name: Move rolling tag
        if: github.ref == 'refs/heads/main'
        run: |
          git tag -f rolling "${GITHUB_SHA}"
          git push -f origin rolling

      - name: Upload to rolling release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rolling
          name: Rolling Release
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: |
            love-macos.zip
            love-macos.zip.sha256
