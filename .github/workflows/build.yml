name: Build all platforms

on:
  push:
    branches: [ai-dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rolling-builds
  cancel-in-progress: true

env:
  DATA_VERSION: '5.1'

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    outputs:
      asset-prefix: ${{ steps.metadata.outputs.asset-prefix }}
      data-asset: ${{ steps.metadata.outputs.data-asset }}
      data-exists: ${{ steps.metadata.outputs.data-exists }}
      data-tag: ${{ steps.metadata.outputs.data-tag }}
      release-title: ${{ steps.metadata.outputs.release-title }}
      rolling-tag: ${{ steps.metadata.outputs.rolling-tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read release versions
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          app_version="$(sed -n 's/^version:[[:space:]]*\([^+[:space:]]*\).*/\1/p' pubspec.yaml)"
          test -n "${app_version}"
          [[ "${app_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]
          [[ "${DATA_VERSION}" =~ ^[0-9]+(\.[0-9]+)*$ ]]
          data_tag="d${DATA_VERSION}"
          data_asset="data.zip"
          status="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/tags/${data_tag}")"
          case "${status}" in
            200)
              asset_names="$(gh api "/repos/${GITHUB_REPOSITORY}/releases/tags/${data_tag}" \
                --jq '.assets[].name')"
              if grep -Fxq "${data_asset}" <<< "${asset_names}"; then
                data_exists=true
              else
                data_exists=false
              fi
              ;;
            404) data_exists=false ;;
            *) echo "Data release lookup failed with HTTP ${status}" >&2; exit 1 ;;
          esac
          echo "asset-prefix=Love-v${app_version}" >> "${GITHUB_OUTPUT}"
          echo "data-asset=${data_asset}" >> "${GITHUB_OUTPUT}"
          echo "data-exists=${data_exists}" >> "${GITHUB_OUTPUT}"
          echo "data-tag=${data_tag}" >> "${GITHUB_OUTPUT}"
          echo "release-title=Love v${app_version}" >> "${GITHUB_OUTPUT}"
          echo "rolling-tag=rolling-$(date -u +%Y%m%d)" >> "${GITHUB_OUTPUT}"

  build-data:
    name: Build data release
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout data source
        if: needs.prepare.outputs.data-exists != 'true'
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Checkout Git LFS data
        if: needs.prepare.outputs.data-exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git lfs checkout

      - name: Install data build dependencies
        if: needs.prepare.outputs.data-exists != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils zip

      - name: Build data archive
        if: needs.prepare.outputs.data-exists != 'true'
        env:
          DATA_ASSET: ${{ needs.prepare.outputs.data-asset }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/compile_corpus.py
          test -f assets/data.zip
          test -f assets/fonts/NotoSansCJK.ttc
          test -f assets/fonts/NotoSerifCJK.ttc
          zip -q "${DATA_ASSET}" \
            assets/data.zip \
            assets/fonts/NotoSansCJK.ttc \
            assets/fonts/NotoSerifCJK.ttc

      - name: Publish data release
        if: needs.prepare.outputs.data-exists != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.data-tag }}
          name: Data ${{ needs.prepare.outputs.data-tag }}
          prerelease: false
          make_latest: false
          overwrite_files: false
          files: ${{ needs.prepare.outputs.data-asset }}

  build-android:
    name: Android APK
    needs: [prepare, build-data]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: false

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_KEYSTORE_BASE64}"
          test -n "${ANDROID_KEYSTORE_PASSWORD}"
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/love-release.jks"
          test -s "${RUNNER_TEMP}/love-release.jks"

      - name: Restore assets archive
        env:
          DATA_ASSET: ${{ needs.prepare.outputs.data-asset }}
          DATA_TAG: ${{ needs.prepare.outputs.data-tag }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release download "${DATA_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "${DATA_ASSET}" \
            --output "${RUNNER_TEMP}/love-assets.zip"
          unzip -q -o "${RUNNER_TEMP}/love-assets.zip" -d .
          test -f assets/data.zip
          test -f assets/fonts/NotoSansCJK.ttc
          test -f assets/fonts/NotoSerifCJK.ttc

      - name: Flutter pub get
        run: flutter pub get

      - name: Build APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/love-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: love-release
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: flutter build apk --release

      - name: Package Android artifact
        env:
          ASSET_PREFIX: ${{ needs.prepare.outputs.asset-prefix }}
        shell: bash
        run: |
          set -euo pipefail
          asset="${ASSET_PREFIX}-android.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "${asset}"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-release
          path: Love-v*-android.apk
          if-no-files-found: error

  build-linux:
    name: Linux release bundle
    needs: [prepare, build-data]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: false

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsqlite3-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore assets archive
        env:
          DATA_ASSET: ${{ needs.prepare.outputs.data-asset }}
          DATA_TAG: ${{ needs.prepare.outputs.data-tag }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release download "${DATA_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "${DATA_ASSET}" \
            --output "${RUNNER_TEMP}/love-assets.zip"
          unzip -q -o "${RUNNER_TEMP}/love-assets.zip" -d .
          test -f assets/data.zip
          test -f assets/fonts/NotoSansCJK.ttc
          test -f assets/fonts/NotoSerifCJK.ttc

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      - name: Package Linux artifact
        env:
          ASSET_PREFIX: ${{ needs.prepare.outputs.asset-prefix }}
        shell: bash
        run: |
          set -euo pipefail
          asset="${ASSET_PREFIX}-linux.tar.gz"
          tar -C build/linux/x64/release/bundle -czf "${asset}" .

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-release
          path: Love-v*-linux.tar.gz
          if-no-files-found: error

  build-macos:
    name: macOS release bundle
    needs: [prepare, build-data]
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: false

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore assets archive
        env:
          DATA_ASSET: ${{ needs.prepare.outputs.data-asset }}
          DATA_TAG: ${{ needs.prepare.outputs.data-tag }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release download "${DATA_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "${DATA_ASSET}" \
            --output "${RUNNER_TEMP}/love-assets.zip"
          unzip -q -o "${RUNNER_TEMP}/love-assets.zip" -d .
          test -f assets/data.zip
          test -f assets/fonts/NotoSansCJK.ttc
          test -f assets/fonts/NotoSerifCJK.ttc

      - name: Flutter pub get
        run: flutter pub get

      - name: Build macOS
        run: flutter build macos --release

      - name: Package macOS artifact
        env:
          ASSET_PREFIX: ${{ needs.prepare.outputs.asset-prefix }}
        shell: bash
        run: |
          set -euo pipefail
          asset="${ASSET_PREFIX}-macos.zip"
          ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/Love.app "${asset}"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-release
          path: Love-v*-macos.zip
          if-no-files-found: error

  build-windows:
    name: Windows release bundle
    needs: [prepare, build-data]
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: false

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore assets archive
        env:
          DATA_ASSET: ${{ needs.prepare.outputs.data-asset }}
          DATA_TAG: ${{ needs.prepare.outputs.data-tag }}
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archivePath = Join-Path $env:RUNNER_TEMP 'love-assets.zip'
          gh release download $env:DATA_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --pattern $env:DATA_ASSET `
            --output $archivePath
          Expand-Archive -Path $archivePath -DestinationPath . -Force
          if (!(Test-Path 'assets/data.zip')) { throw 'Missing assets/data.zip' }
          if (!(Test-Path 'assets/fonts/NotoSansCJK.ttc')) { throw 'Missing assets/fonts/NotoSansCJK.ttc' }
          if (!(Test-Path 'assets/fonts/NotoSerifCJK.ttc')) { throw 'Missing assets/fonts/NotoSerifCJK.ttc' }

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Package Windows artifact
        env:
          ASSET_PREFIX: ${{ needs.prepare.outputs.asset-prefix }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $asset = "$env:ASSET_PREFIX-windows.zip"
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath $asset -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-release
          path: Love-v*-windows.zip
          if-no-files-found: error

  release:
    name: Publish rolling release
    if: github.ref == 'refs/heads/ai-dev'
    needs:
      - prepare
      - build-android
      - build-linux
      - build-macos
      - build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: '*-release'
          path: release-assets
          merge-multiple: true

      - name: Move rolling tag
        env:
          ROLLING_TAG: ${{ needs.prepare.outputs.rolling-tag }}
        shell: bash
        run: |
          set -euo pipefail
          git tag -f "${ROLLING_TAG}" "${GITHUB_SHA}"
          git push -f origin "${ROLLING_TAG}"

      - name: Upload rolling release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.rolling-tag }}
          name: ${{ needs.prepare.outputs.release-title }}
          prerelease: false
          make_latest: true
          overwrite_files: true
          files: |
            release-assets/Love-v*-android.apk
            release-assets/Love-v*-linux.tar.gz
            release-assets/Love-v*-macos.zip
            release-assets/Love-v*-windows.zip
