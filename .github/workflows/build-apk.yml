name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rolling-apk
  cancel-in-progress: true

jobs:
  build-apk:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Package APK artifact
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk love-android.apk
          sha256sum love-android.apk > love-android.apk.sha256

      - name: Move rolling tag
        if: github.ref == 'refs/heads/main'
        run: |
          git tag -f rolling "${GITHUB_SHA}"
          git push -f origin rolling

      - name: Upload to rolling release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rolling
          name: Rolling Release
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: |
            love-android.apk
            love-android.apk.sha256
